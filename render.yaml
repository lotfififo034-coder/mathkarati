services:
  - type: web
    name: mathkarati-app
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300 --worker-class sync --graceful-timeout 60 --keep-alive 5
    envVars:
      - key: FLASK_ENV
        value: production
    healthCheckPath: /ping
