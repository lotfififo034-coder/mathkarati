services:
  - type: web
    name: mathkarati-pro
    runtime: python
    buildCommand: pip install -r requirements.txt && cd node_scripts && npm install --production
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.0"
